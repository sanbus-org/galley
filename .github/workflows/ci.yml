      - name: Install Rust
        uses: actions-rust-lang/rustup@v1
        with:
          toolchain: stable

      - name: Verify tag matches the single Galley version
        run: test "${GITHUB_REF_NAME#v}" = "$(python3 scripts/product_version.py)"

      - name: Publish Rust crate
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
