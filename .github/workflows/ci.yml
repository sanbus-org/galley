  publish-python:
    name: publish-python
    if: ${{ github.server_url == 'https://github.com' && github.ref_type == 'tag' && startsWith(github.ref_name, 'v') }}
    needs:
      - test
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Verify tag matches the single Galley version
        run: test "${GITHUB_REF_NAME#v}" = "$(python3 scripts/product_version.py)"

      - name: Publish Python package
        env:
          PYPI_API_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          pip install build twine
          ./scripts/python/publish_python.sh

  publish-java:
    name: publish-java
    if: ${{ github.server_url == 'https://github.com' && github.ref_type == 'tag' && startsWith(github.ref_name, 'v') }}
    needs:
      - test
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 22

      - name: Verify tag matches the single Galley version
        run: test "${GITHUB_REF_NAME#v}" = "$(python3 scripts/product_version.py)"

      - name: Publish Java artifact
        env:
          OSSRH_USERNAME: ${{ secrets.OSSRH_USERNAME }}
          OSSRH_TOKEN: ${{ secrets.OSSRH_TOKEN }}
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: ./scripts/java/publish_java.sh

  publish-go:
    name: publish-go
    if: ${{ github.server_url == 'https://github.com' && github.ref_type == 'tag' && startsWith(github.ref_name, 'v') }}
    needs:
      - test
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Verify tag matches the single Galley version
        run: test "${GITHUB_REF_NAME#v}" = "$(python3 scripts/product_version.py)"

      - name: Push Go module tag
        run: ./scripts/go/publish_go.sh

  test:
    name: test
    if: ${{ always() }}
    needs:
      - core
      - parser-cases
      - bindings
      - bindings-consistency
      - example-benchmarks
      - javascript
      - compiler-cli
    runs-on: ${{ contains(github.server_url, 'github') && 'ubuntu-latest' || 'codeberg-medium' }}
    steps:
      - name: Verify CI results
        env:
          CORE_RESULT: ${{ needs.core.result }}
          PARSER_CASES_RESULT: ${{ needs.parser-cases.result }}
          BINDINGS_RESULT: ${{ needs.bindings.result }}
          BINDINGS_CONSISTENCY_RESULT: ${{ needs.bindings-consistency.result }}
          EXAMPLE_BENCHMARKS_RESULT: ${{ needs.example-benchmarks.result }}
          JAVASCRIPT_RESULT: ${{ needs.javascript.result }}
          COMPILER_CLI_RESULT: ${{ needs.compiler-cli.result }}
        run: |
          echo "core: $CORE_RESULT"
          echo "parser-cases: $PARSER_CASES_RESULT"
          echo "bindings: $BINDINGS_RESULT"
          echo "bindings-consistency: $BINDINGS_CONSISTENCY_RESULT"
          echo "example-benchmarks: $EXAMPLE_BENCHMARKS_RESULT"
          echo "javascript: $JAVASCRIPT_RESULT"
          echo "compiler-cli: $COMPILER_CLI_RESULT"
          test "$CORE_RESULT" = success
          test "$PARSER_CASES_RESULT" = success
