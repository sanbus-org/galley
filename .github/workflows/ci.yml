name: CI

on:
  push:
    branches:
      - main
    tags:
      - v*
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  core:
    name: core
    runs-on: ${{ contains(github.server_url, 'github') && 'ubuntu-latest' || 'codeberg-medium' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Zig
        run: |
          URL=$(curl -s https://ziglang.org/download/index.json | jq -r '."0.16.0"."x86_64-linux".tarball')
          curl -L "$URL" -o zig.tar.xz
          tar -xf zig.tar.xz
          echo "$PWD/zig-x86_64-linux-0.16.0" >>$GITHUB_PATH

      - name: Verify package consumer
        run: zig build -j1 test-package-consumer --summary all

      - name: Run core test suites
        run: |
          zig build -j1 test \
            --summary all \
            --test-timeout 30m \
            -Dtest-filter=suite:build \
            -Dtest-filter=suite:generator \
            -Dtest-filter=suite:runtime \
            -Dtest-filter=suite:galley-parity

  parser-cases:
    name: parser-cases (${{ matrix.case }})
    runs-on: ${{ contains(github.server_url, 'github') && 'ubuntu-latest' || 'codeberg-medium' }}
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        case:
          - ll-galley
          - lr-galley
          - ll-json-structured-ast
          - lr-json-structured-ast
          - ll-json
          - lr-json
          - ll-json-augmented
          - ll-json-recovery
          - lr-json-recovery
          - ll-lisp
          - ll-indentation
          - ll-lua
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Fetch large sample fixtures
        run: |
          case="${{ matrix.case }}"
          bash scripts/fetch-large-samples.sh "${case#*-}"

      - name: Install Zig
        run: |
          URL=$(curl -s https://ziglang.org/download/index.json | jq -r '."0.16.0"."x86_64-linux".tarball')
          curl -L "$URL" -o zig.tar.xz
          tar -xf zig.tar.xz
          echo "$PWD/zig-x86_64-linux-0.16.0" >>$GITHUB_PATH

      - name: Run parser test case
        run: |
          zig build -j1 test \
            --summary all \
            --test-timeout 30m \
            -Dtest-filter=case:${{ matrix.case }}

  bindings:
    name: bindings (${{ matrix.language }})
    runs-on: ${{ contains(github.server_url, 'github') && 'ubuntu-latest' || 'codeberg-medium' }}
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        language:
          - c
          - cpp
          - rust
          - go
          - python
          - typescript
          - deno
          - bun
          - wasm
          - zig
          - java
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Zig
        run: |
          URL=$(curl -s https://ziglang.org/download/index.json | jq -r '."0.16.0"."x86_64-linux".tarball')
          curl -L "$URL" -o zig.tar.xz
          tar -xf zig.tar.xz
          echo "$PWD/zig-x86_64-linux-0.16.0" >>$GITHUB_PATH

      - name: Install Go
        if: ${{ matrix.language == 'go' }}
        uses: actions/setup-go@v6
        with:
          go-version: stable
          cache: false

      - name: Install Node
        if: ${{ matrix.language == 'typescript' || matrix.language == 'wasm' }}
        uses: actions/setup-node@v6
        with:
          node-version: 26

      - name: Install Python
        if: ${{ matrix.language == 'python' }}
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install Java
        if: ${{ matrix.language == 'java' }}
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 22

      - name: Install Deno
        if: ${{ matrix.language == 'deno' }}
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Install Bun
        if: ${{ matrix.language == 'bun' }}
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9

      - name: Build and run example (cmake)
        if: ${{ matrix.language == 'c' || matrix.language == 'cpp' }}
        run: |
          cmake -S examples/${{ matrix.language }} -B build-${{ matrix.language }} \
            -DCMAKE_BUILD_TYPE=Release -DGALLEY_CHECKOUT="$GITHUB_WORKSPACE"
          cmake --build build-${{ matrix.language }}
          ./build-${{ matrix.language }}/bin/demo

      - name: Test bindings (c/cpp)
        if: ${{ matrix.language == 'c' || matrix.language == 'cpp' }}
        run: |
          cmake -S bindings/c/test-fixture -B build-c-fixture \
            -DCMAKE_BUILD_TYPE=Release -DGALLEY_CHECKOUT="$GITHUB_WORKSPACE"
          if [ "${{ matrix.language }}" = cpp ]; then target=test_bindings_cpp; test=bindings-cpp; else target=test_bindings_c; test=bindings-c; fi
          cmake --build build-c-fixture --target "$target"
          ctest --test-dir build-c-fixture -R "^$test\$" --output-on-failure

      - name: Build and run example (cargo)
        if: ${{ matrix.language == 'rust' }}
        run: |
          GALLEY_CHECKOUT="$GITHUB_WORKSPACE" \
            cargo run --release --manifest-path examples/rust/Cargo.toml

      - name: Test bindings (cargo)
        if: ${{ matrix.language == 'rust' }}
        env:
          GALLEY_CHECKOUT: ${{ github.workspace }}
        run: cargo test --release --manifest-path bindings/rust/test-fixture/Cargo.toml

      - name: Build and run example (go)
        if: ${{ matrix.language == 'go' }}
        working-directory: examples/go
        env:
          GALLEY_CHECKOUT: ${{ github.workspace }}
        run: |
          go generate ./...
          go build -o galley-go-example ./demo
          ./galley-go-example

      - name: Test bindings (go)
        if: ${{ matrix.language == 'go' }}
        working-directory: bindings/go
        env:
          GALLEY_CHECKOUT: ${{ github.workspace }}
        run: |
          go generate ./testfixture/
          go test -count=1 ./testfixture/
      - name: Build and run example (python)
        if: ${{ matrix.language == 'python' }}
        working-directory: examples/python
        env:
          GALLEY_CHECKOUT: ${{ github.workspace }}
        run: |
          pip install -e .
          python -m galley_bindings .
          python demo.py

      - name: Test bindings (python)
        if: ${{ matrix.language == 'python' }}
        env:
          GALLEY_CHECKOUT: ${{ github.workspace }}
        run: |
          pip install -e bindings/python
          python -m galley_bindings bindings/python/test-fixture
          PYTHONPATH="$GITHUB_WORKSPACE/bindings/python/test-fixture" python bindings/python/tests/test_bindings.py

      - name: Build and run example (typescript)
        if: ${{ matrix.language == 'typescript' }}
        working-directory: examples/js/node
        env:
          GALLEY_CHECKOUT: ${{ github.workspace }}
        run: |
          npm install
          npm --prefix ../../../bindings/js install
          npx galley-js-node .
          npx tsx demo.ts

      - name: Test bindings (typescript)
        if: ${{ matrix.language == 'typescript' }}
        env:
          GALLEY_CHECKOUT: ${{ github.workspace }}
        run: |
          npm --prefix bindings/js install --no-audit --no-fund
          node bindings/js/node/tests/test_bindings.mjs

      - name: Build and run example (deno)
        if: ${{ matrix.language == 'deno' }}
        working-directory: examples/js/deno
        env:
          GALLEY_CHECKOUT: ${{ github.workspace }}
        run: |
          deno task build
          deno task demo

      - name: Test bindings (deno)
        if: ${{ matrix.language == 'deno' }}
        working-directory: bindings/js/deno
        env:
          GALLEY_CHECKOUT: ${{ github.workspace }}
        run: |
          deno task test

      - name: Build and run example (bun)
        if: ${{ matrix.language == 'bun' }}
        working-directory: examples/js/bun
        env:
          GALLEY_CHECKOUT: ${{ github.workspace }}
        run: |
          bun install
          (cd ../../../bindings/js && rm -f package-lock.json bun.lock && bun install)
          bunx galley-js-bun .
          bun demo.ts

      - name: Test bindings (bun)
        if: ${{ matrix.language == 'bun' }}
        env:
          GALLEY_CHECKOUT: ${{ github.workspace }}
        run: |
          (cd bindings/js && rm -f package-lock.json bun.lock && bun install)
          bun bindings/js/bun/tests/test_bindings.mjs

      - name: Build and run example (wasm)
        if: ${{ matrix.language == 'wasm' }}
        working-directory: examples/js/wasm
        env:
          GALLEY_CHECKOUT: ${{ github.workspace }}
        run: |
          npm install
          npm --prefix ../../../bindings/js install
          npx galley-js-wasm .
          npx tsx demo.ts

      - name: Test bindings (wasm)
        if: ${{ matrix.language == 'wasm' }}
        env:
          GALLEY_CHECKOUT: ${{ github.workspace }}
        run: |
          npm --prefix bindings/js install --no-audit --no-fund
          node bindings/js/wasm/tests/test_bindings.mjs

      - name: Build and run example (zig)
        if: ${{ matrix.language == 'zig' }}
        working-directory: examples/zig
        run: zig build run

      - name: Build and run example (java)
        if: ${{ matrix.language == 'java' }}
        env:
          GALLEY_CHECKOUT: ${{ github.workspace }}
        run: |
          javac --release 22 -d bindings/java/out $(find bindings/java/src/main/java -name "*.java")
          java --enable-native-access=ALL-UNNAMED -cp bindings/java/out org.sanbus.galley.build.GalleyBuild examples/java
          javac --release 22 -cp bindings/java/out -d examples/java/out $(find examples/java/src/main/java -name "*.java")
          java --enable-native-access=ALL-UNNAMED -cp bindings/java/out:examples/java/out com.example.Demo

      - name: Test bindings (java)
        if: ${{ matrix.language == 'java' }}
        env:
          GALLEY_CHECKOUT: ${{ github.workspace }}
          GALLEY_LIBRARY_PATH: ${{ github.workspace }}/bindings/java/test-fixture/libgalley-java.so
        run: |
          javac --release 22 -d bindings/java/out $(find bindings/java/src/main/java -name "*.java")
          java --enable-native-access=ALL-UNNAMED -cp bindings/java/out org.sanbus.galley.build.GalleyBuild bindings/java/test-fixture
          mvn -B -f bindings/java/pom.xml test

  bindings-consistency:
    name: bindings-consistency
    runs-on: ${{ contains(github.server_url, 'github') && 'ubuntu-latest' || 'codeberg-medium' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Zig
        run: |
          URL=$(curl -s https://ziglang.org/download/index.json | jq -r '."0.16.0"."x86_64-linux".tarball')
          curl -L "$URL" -o zig.tar.xz
          tar -xf zig.tar.xz
          echo "$PWD/zig-x86_64-linux-0.16.0" >>$GITHUB_PATH

      - name: Install Go
        uses: actions/setup-go@v6
        with:
          go-version: stable
          cache: false

      - name: Install Node
        uses: actions/setup-node@v6
        with:
          node-version: 26

      - name: Install Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 22

      - name: Install Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9

      - name: Grammar, options, and error messages are identical across bindings
        run: |
          same() {
            name="$1"
            shift
            unique=$(sha256sum "$@" | awk '{print $1}' | sort -u)
            count=$(printf '%s\n' "$unique" | wc -l)
            echo "$name: $count distinct variants"
            test "$count" = 1 || { echo "::error::$name differs across examples"; exit 1; }
          }
          same ll.grm examples/{c,cpp,rust,python,zig,java}/ll.grm examples/js/node/ll.grm examples/js/deno/ll.grm examples/js/bun/ll.grm examples/js/wasm/ll.grm examples/js/universal/ll.grm examples/go/demo/ll.grm
          same config.zig examples/{c,cpp,rust,python,zig,java}/config.zig examples/js/node/config.zig examples/js/deno/config.zig examples/js/bun/config.zig examples/js/wasm/config.zig examples/js/universal/config.zig examples/go/demo/config.zig
          same benchmark/ll.grm examples/{c,cpp,rust,python,zig,java}/benchmark/ll.grm examples/js/node/benchmark/ll.grm examples/js/deno/benchmark/ll.grm examples/js/bun/benchmark/ll.grm examples/js/wasm/benchmark/ll.grm examples/js/universal/benchmark/ll.grm
          same benchmark/config.zig examples/{c,cpp,rust,python,zig,java}/benchmark/config.zig examples/js/node/benchmark/config.zig examples/js/deno/benchmark/config.zig examples/js/bun/benchmark/config.zig examples/js/wasm/benchmark/config.zig examples/js/universal/benchmark/config.zig
          for f in examples/{c,cpp,rust,python,zig,java}/benchmark/ll.grm examples/js/node/benchmark/ll.grm examples/js/deno/benchmark/ll.grm examples/js/bun/benchmark/ll.grm examples/js/wasm/benchmark/ll.grm examples/js/universal/benchmark/ll.grm; do
            test -L "$f" || {
              echo "::error::$f must be a symlink to languages/json/ll.grm"
              exit 1
            }
          done
          cmp -s languages/json/ll.grm examples/c/benchmark/ll.grm || {
            echo "::error::examples/*/benchmark/ll.grm must match languages/json/ll.grm"
            exit 1
          }
          for f in bindings/c/test-fixture/ll.grm bindings/c/test-fixture/config.zig bindings/go/testfixture/ll.grm bindings/go/testfixture/config.zig bindings/python/test-fixture/ll.grm bindings/python/test-fixture/config.zig bindings/java/test-fixture/ll.grm bindings/java/test-fixture/config.zig bindings/rust/test-fixture/ll.grm bindings/rust/test-fixture/config.zig bindings/js/test-fixture/ll.grm bindings/js/test-fixture/config.zig; do
            test -L "$f" || {
              echo "::error::$f must be a symlink to bindings/test-fixture"
              exit 1
            }
          done
          cmp -s bindings/test-fixture/ll.grm bindings/go/testfixture/ll.grm || {
            echo "::error::binding fixture grammars must match bindings/test-fixture"
            exit 1
          }

      - name: Galley checkout contract is core-minimal, fetch is examples-only
        run: |
          check_core() {
            file="$1"
            for var in GALLEY_CHECKOUT ZIG_EXECUTABLE; do
              if ! grep -q "$var" "$file"; then
                echo "::error::$file missing $var handling (core requires GALLEY_CHECKOUT)"
                exit 1
              fi
            done
            for banned in GALLEY_REPOSITORY GALLEY_TAG galley-src galley-tag UserCacheDir cacheDir Library/Caches XDG_CACHE_HOME; do
              if grep -q "$banned" "$file"; then
                echo "::error::$file mentions $banned (fetching and per-grammar cache are examples-only, not core)"
                exit 1
              fi
            done
            if ! grep -q "fetch-galley.sh" "$file"; then
              echo "::error::$file does not point at examples/scripts/fetch-galley.sh (core must document the examples-only fetch)"
              exit 1
            fi
            echo "Core contract present in $file"
          }
          check_core bindings/go/cmd/galley/main.go
          check_core bindings/rust/src/build_helper.rs
          check_core bindings/python/galley_bindings/build.py
          # The per-adapter builders are thin wrappers delegating to one
          # shared gate, so the contract is policed there and at the single
          # `galley build` entry — not once per wrapper.
          check_core bindings/js/core/build/builder.mjs
          check_core bindings/js/universal/build.mjs
          check_core bindings/java/src/main/java/org/sanbus/galley/build/GalleyBuild.java
          check_core examples/c/CMakeLists.txt
          check_core examples/cpp/CMakeLists.txt
          for var in GALLEY_REPOSITORY GALLEY_TAG; do
            if ! grep -q "$var" examples/scripts/fetch-galley.sh; then
              echo "::error::examples/scripts/fetch-galley.sh missing $var handling"
              exit 1
            fi
          done
          echo "Galley checkout contract enforced: checkout required everywhere, fetch lives in fetch-galley.sh only"

      - name: JavaScript packages share one lockstep version
        run: python3 scripts/js/check_js_versions.py

      - name: Manifest versions are the 0.0.0 sentinel
        run: python3 scripts/check_versions.py

      - name: Generated parser artifacts are identical across bindings
        run: |
          zig build -Doptimize=ReleaseFast install
          for lang in c cpp rust python java; do
            ./zig-out/bin/galley --emit-metadata "examples/$lang" >/dev/null
          done
          ./zig-out/bin/galley --emit-metadata "examples/js/node" >/dev/null
          ./zig-out/bin/galley --emit-metadata "examples/js/deno" >/dev/null
          ./zig-out/bin/galley --emit-metadata "examples/js/bun" >/dev/null
          ./zig-out/bin/galley --emit-metadata "examples/js/wasm" >/dev/null
          ./zig-out/bin/galley --emit-metadata "examples/js/universal" >/dev/null
          ./zig-out/bin/galley "examples/zig" >/dev/null
          unique=$(sha256sum examples/{c,cpp,rust,python,zig,java}/_ll-parser.zig examples/js/node/_ll-parser.zig examples/js/deno/_ll-parser.zig examples/js/bun/_ll-parser.zig examples/js/wasm/_ll-parser.zig examples/js/universal/_ll-parser.zig | awk '{print $1}' | sort -u)
          count=$(printf '%s\n' "$unique" | wc -l)
          echo "_ll-parser.zig: $count distinct variants"
          test "$count" = 1 || { echo "::error::generated _ll-parser.zig differs across examples despite identical grammar and options"; exit 1; }
          unique=$(sha256sum examples/{c,cpp,rust,python,java}/procedures.zig examples/js/node/procedures.zig examples/js/deno/procedures.zig examples/js/bun/procedures.zig examples/js/wasm/procedures.zig examples/js/universal/procedures.zig | awk '{print $1}' | sort -u)
          count=$(printf '%s\n' "$unique" | wc -l)
          echo "procedures.zig: $count distinct variants"
          test "$count" = 1 || { echo "::error::generated procedures.zig differs across bindings despite identical grammar and options"; exit 1; }

      - name: Procedure entry points are identical across bindings
        run: |
          names() {
            grep -hoE '\b(hook_|reduction)[A-Za-z0-9_]*[[:space:]]*\(' "$1" | tr -d ' \t(' | sort -u
          }
          names examples/c/procedures.c > /tmp/names-c.txt
          names examples/cpp/procedures.cpp > /tmp/names-cpp.txt
          names examples/rust/procedures.rs > /tmp/names-rust.txt
          names examples/go/demo/procedures.go > /tmp/names-go.txt
          names examples/python/procedures.py > /tmp/names-python.txt
          names examples/js/node/procedures.ts > /tmp/names-typescript.txt
          names examples/js/deno/procedures.ts > /tmp/names-deno.txt
          names examples/js/bun/procedures.ts > /tmp/names-bun.txt
          names examples/js/wasm/procedures.ts > /tmp/names-wasm.txt
          names examples/js/universal/procedures.ts > /tmp/names-universal.txt
          names examples/java/procedures.java > /tmp/names-java.txt
          diff /tmp/names-c.txt /tmp/names-cpp.txt || { echo "::error::C and C++ procedure entry points differ"; exit 1; }
          diff /tmp/names-c.txt /tmp/names-rust.txt || { echo "::error::C and Rust procedure entry points differ"; exit 1; }
          diff /tmp/names-c.txt /tmp/names-go.txt || { echo "::error::C and Go procedure entry points differ"; exit 1; }
          diff /tmp/names-c.txt /tmp/names-python.txt || { echo "::error::C and Python procedure entry points differ"; exit 1; }
          diff /tmp/names-c.txt /tmp/names-typescript.txt || { echo "::error::C and TypeScript procedure entry points differ"; exit 1; }
          diff /tmp/names-c.txt /tmp/names-deno.txt || { echo "::error::C and Deno procedure entry points differ"; exit 1; }
          diff /tmp/names-c.txt /tmp/names-bun.txt || { echo "::error::C and Bun procedure entry points differ"; exit 1; }
          diff /tmp/names-c.txt /tmp/names-wasm.txt || { echo "::error::C and WebAssembly procedure entry points differ"; exit 1; }
          diff /tmp/names-c.txt /tmp/names-universal.txt || { echo "::error::C and Universal procedure entry points differ"; exit 1; }
          diff /tmp/names-c.txt /tmp/names-java.txt || { echo "::error::C and Java procedure entry points differ"; exit 1; }
          names examples/zig/procedures.zig > /tmp/names-zig.txt
          diff /tmp/names-c.txt /tmp/names-zig.txt || { echo "::error::C and Zig procedure entry points differ"; exit 1; }
          echo "procedure entry points ($(wc -l < /tmp/names-c.txt)) are identical across all bindings"

      - name: LR family builds through the c abi
        run: |
          work=/tmp/galley-lr-smoke
          rm -rf "$work" && mkdir -p "$work"
          cp examples/c/ll.grm "$work/lr.grm"
          cp examples/c/config.zig examples/c/procedures.c "$work/"
          ./zig-out/bin/galley --parser-type lr --emit-metadata "$work" >/dev/null
          zig build --build-file bindings/c/consumer/build.zig \
            "-Dparser-source=$work/_lr-parser.zig" \
            -Dlib-name=keyvalue-lr -Doutput=libkeyvalue-lr.so -Doptimize=ReleaseFast \
            --prefix "$work" install
          cat > "$work/driver.c" <<'EOF'
          #include <galley.h>
          #include <stdio.h>
          int main(void) {
              if (galley_parser_type() != galley_parser_type_lr) {
                  fprintf(stderr, "expected an lr library\n");
                  return 1;
              }
              GalleySession *session = galley_session_create();
              long long parsed = galley_parse_sentinel(session, "alpha:12,beta:3");
              if (parsed != 15 || galley_node_count(session) == 0) {
                  fprintf(stderr, "lr parse failed (parsed=%lld)\n", parsed);
                  return 1;
              }
              const char *message = NULL;
              galley_parse_sentinel(session, "alpha:");
              if (galley_diagnostic_message(session, &message) != galley_ok || message == NULL) {
                  fprintf(stderr, "expected a diagnostic for the broken sample\n");
                  return 1;
              }
              printf("lr smoke ok: parsed %lld bytes, %llu nodes\n", parsed, galley_node_count(session));
              galley_session_destroy(session);
              return 0;
          }
          EOF
          cc "$work/driver.c" -I"bindings/c" -L"$work" \
            -lkeyvalue-lr -Wl,-rpath,"$work" -o "$work/driver"
          "$work/driver"

      - name: Example output is identical across bindings
        run: |
          for lang in c cpp; do
            cmake -S examples/$lang -B /tmp/build-$lang -DCMAKE_BUILD_TYPE=Release -DGALLEY_CHECKOUT="$PWD" >/dev/null
            cmake --build /tmp/build-$lang >/dev/null
          done
          GALLEY_CHECKOUT="$PWD" cargo build --release --manifest-path examples/rust/Cargo.toml >/dev/null
          cd examples/go
          GALLEY_CHECKOUT="$PWD/../.." go generate ./...
          go build -o /tmp/example-go ./demo
          cd ../..
          cd examples/python
          pip install -e . >/dev/null
          GALLEY_CHECKOUT="$PWD/../.." python -m galley_bindings . >/dev/null
          python demo.py >/tmp/out-python.txt 2>/tmp/err-python.txt
          cd ../..
          cd examples/js/node
          npm install >/dev/null 2>&1
          npm --prefix ../../../bindings/js install >/dev/null 2>&1
          GALLEY_CHECKOUT="$PWD/../../.." npx galley-js-node . >/dev/null
          npx tsx demo.ts >/tmp/out-js-node.txt 2>/tmp/err-js-node.txt
          cd ../../..
          cd examples/js/deno
          GALLEY_CHECKOUT="$PWD/../../.." deno run --allow-read --allow-write --allow-run --allow-env ../../../bindings/js/deno/build.ts . >/dev/null
          deno run --allow-ffi --allow-read --allow-write --allow-env demo.ts >/tmp/out-js-deno.txt 2>/tmp/err-js-deno.txt
          cd ../../..
          cd examples/js/bun
          bun install >/dev/null 2>&1
          (cd ../../../bindings/js && rm -f package-lock.json bun.lock && bun install >/dev/null 2>&1)
          GALLEY_CHECKOUT="$PWD/../../.." bunx galley-js-bun . >/dev/null
          bun demo.ts >/tmp/out-js-bun.txt 2>/tmp/err-js-bun.txt
          cd ../../..
          cd examples/js/wasm
          npm install >/dev/null 2>&1
          npm --prefix ../../../bindings/js install >/dev/null 2>&1
          GALLEY_CHECKOUT="$PWD/../../.." npx galley-js-wasm . >/dev/null
          npx tsx demo.ts >/tmp/out-js-wasm.txt 2>/tmp/err-js-wasm.txt
          cd ../../..
          cd examples/js/universal
          npm install >/dev/null 2>&1
          npm --prefix ../../../bindings/js install >/dev/null 2>&1
          npm --prefix ../../../bindings/js/universal install >/dev/null 2>&1
          GALLEY_CHECKOUT="$PWD/../../.." npx galley build . >/dev/null
          npx tsx demo.ts >/tmp/out-js-universal.txt 2>/tmp/err-js-universal.txt
          GALLEY_WASM=1 npx tsx demo.ts >/tmp/out-js-universal-wasm.txt 2>/tmp/err-js-universal-wasm.txt
          cd ../../..
          cd examples/zig
          zig build
          zig-out/bin/demo >/tmp/out-zig.txt 2>/tmp/err-zig.txt
          cd ../..
          javac --release 22 -d bindings/java/out $(find bindings/java/src/main/java -name "*.java")
          GALLEY_CHECKOUT="$PWD" java --enable-native-access=ALL-UNNAMED -cp bindings/java/out org.sanbus.galley.build.GalleyBuild examples/java
          javac --release 22 -cp bindings/java/out -d examples/java/out $(find examples/java/src/main/java -name "*.java")
          java --enable-native-access=ALL-UNNAMED -cp bindings/java/out:examples/java/out com.example.Demo >/tmp/out-java.txt 2>/tmp/err-java.txt

          /tmp/build-c/bin/demo >/tmp/out-c.txt 2>/tmp/err-c.txt
          /tmp/build-cpp/bin/demo >/tmp/out-cpp.txt 2>/tmp/err-cpp.txt
          examples/rust/target/release/galley-rust-example >/tmp/out-rust.txt 2>/tmp/err-rust.txt
          /tmp/example-go >/tmp/out-go.txt 2>/tmp/err-go.txt

          compare() {
            if ! diff -u "$1" "$2"; then
              echo "::error::example output differs ($1 vs $2)"
              echo "===== $1 ====="; cat "$1"
              echo "===== $2 ====="; cat "$2"
              exit 1
            fi
          }
          compare /tmp/out-c.txt /tmp/out-cpp.txt
          compare /tmp/out-c.txt /tmp/out-rust.txt
          compare /tmp/out-c.txt /tmp/out-go.txt
          compare /tmp/out-c.txt /tmp/out-python.txt
          compare /tmp/out-c.txt /tmp/out-js-node.txt
          compare /tmp/out-c.txt /tmp/out-js-deno.txt
          compare /tmp/out-c.txt /tmp/out-js-bun.txt
          compare /tmp/out-c.txt /tmp/out-js-wasm.txt
          compare /tmp/out-c.txt /tmp/out-js-universal.txt
          compare /tmp/out-c.txt /tmp/out-js-universal-wasm.txt
          compare /tmp/out-c.txt /tmp/out-zig.txt
          compare /tmp/out-c.txt /tmp/out-java.txt
          compare /tmp/err-c.txt /tmp/err-cpp.txt
          compare /tmp/err-c.txt /tmp/err-rust.txt
          compare /tmp/err-c.txt /tmp/err-go.txt
          compare /tmp/err-c.txt /tmp/err-python.txt
          compare /tmp/err-c.txt /tmp/err-js-node.txt
          compare /tmp/err-c.txt /tmp/err-js-deno.txt
          compare /tmp/err-c.txt /tmp/err-js-bun.txt
          compare /tmp/err-c.txt /tmp/err-js-wasm.txt
          compare /tmp/err-c.txt /tmp/err-js-universal.txt
          compare /tmp/err-c.txt /tmp/err-js-universal-wasm.txt
          compare /tmp/err-c.txt /tmp/err-zig.txt
          compare /tmp/err-c.txt /tmp/err-java.txt
          echo "example output ($(wc -l < /tmp/out-c.txt) stdout lines, $(wc -l < /tmp/err-c.txt) stderr lines) is identical across all bindings"

  example-benchmarks:
    name: example-benchmarks
    runs-on: ${{ contains(github.server_url, 'github') && 'ubuntu-latest' || 'codeberg-medium' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Fetch large JSON sample
        run: bash scripts/fetch-large-samples.sh json

      - name: Install Zig
        run: |
          URL=$(curl -s https://ziglang.org/download/index.json | jq -r '."0.16.0"."x86_64-linux".tarball')
          curl -L "$URL" -o zig.tar.xz
          tar -xf zig.tar.xz
          echo "$PWD/zig-x86_64-linux-0.16.0" >>$GITHUB_PATH

      - name: Install Go
        uses: actions/setup-go@v6
        with:
          go-version: stable
          cache: false

      - name: Install Node
        uses: actions/setup-node@v6
        with:
          node-version: 26

      - name: Install Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 22

      - name: Install Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9

      - name: Build example benchmarks
        env:
          GALLEY_CHECKOUT: ${{ github.workspace }}
        run: |
          javac --release 22 -d bindings/java/out $(find bindings/java/src/main/java -name "*.java")
          java --enable-native-access=ALL-UNNAMED -cp bindings/java/out org.sanbus.galley.build.GalleyBuild examples/java/benchmark
          javac --release 22 -cp bindings/java/out -d examples/java/out $(find examples/java/src/main/java -name "*.java")
          cmake -S examples/c -B /tmp/build-c -DCMAKE_BUILD_TYPE=Release -DGALLEY_CHECKOUT="$PWD"
          cmake --build /tmp/build-c --target benchmark
          cmake -S examples/cpp -B /tmp/build-cpp -DCMAKE_BUILD_TYPE=Release -DGALLEY_CHECKOUT="$PWD"
          cmake --build /tmp/build-cpp --target benchmark
          cargo build --release --manifest-path examples/rust/Cargo.toml -p galley-rust-benchmark
          cd examples/go
          go generate ./...
          go build -o /tmp/galley-go-benchmark ./benchmark
          cd ../python
          pip install -e .
          python -m galley_bindings benchmark
          cd ../js/node
          npm install
          npm --prefix ../../../bindings/js install
          npx galley-js-node benchmark
          cd ../deno
          deno run --allow-read --allow-write --allow-run --allow-env ../../../bindings/js/deno/build.ts benchmark
          cd ../bun
          bun install
          (cd ../../../bindings/js && rm -f package-lock.json bun.lock && bun install)
          bunx galley-js-bun benchmark
          cd ../wasm
          npm install
          npm --prefix ../../../bindings/js install
          npx galley-js-wasm benchmark
          cd ../../zig
          zig build -Doptimize=ReleaseFast
          cd ../..

      - name: Compare interleaved throughput to examples/zig
        env:
          GALLEY_CHECKOUT: ${{ github.workspace }}
        run: python3 scripts/compare_example_benchmarks.py

  javascript:
    name: javascript
    runs-on: ${{ contains(github.server_url, 'github') && 'ubuntu-latest' || 'codeberg-medium' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Zig
        run: |
          URL=$(curl -s https://ziglang.org/download/index.json | jq -r '."0.16.0"."x86_64-linux".tarball')
          curl -L "$URL" -o zig.tar.xz
          tar -xf zig.tar.xz
          echo "$PWD/zig-x86_64-linux-0.16.0" >>$GITHUB_PATH

      - name: Install Node
        uses: actions/setup-node@v6
        with:
          node-version: 26

      - name: Install Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9

      - name: Install and build JavaScript bindings
        run: |
          npm --prefix bindings/js install --no-audit --no-fund
          npm run build --prefix bindings/js
          npm --prefix bindings/js/universal install --no-audit --no-fund

      - name: Test JavaScript loader
        env:
          GALLEY_CHECKOUT: ${{ github.workspace }}
        run: |
          npm --prefix bindings/js/universal test
          bun bindings/js/universal/tests/test_loader_bun.mjs
          (cd bindings/js/universal && deno task test)
          node --experimental-vm-modules bindings/js/universal/tests/test_loader_browser.mjs

      - name: Test bundler matrix
        env:
          GALLEY_CHECKOUT: ${{ github.workspace }}
        run: |
          MATRIX=/tmp/bundler-matrix
          rm -rf "$MATRIX"
          mkdir -p "$MATRIX/grammar"
          cp bindings/js/test-fixture/ll.grm "$MATRIX/grammar/ll.grm"
          node bindings/js/wasm/build.mjs "$MATRIX/grammar"
          cp bindings/js/universal/tests/bundler/* "$MATRIX/"
          cat > "$MATRIX/package.json" <<EOF
          {
            "name": "galley-bundler-matrix",
            "type": "module",
            "private": true,
            "dependencies": {
              "@sanbus/galley": "file:${{ github.workspace }}/bindings/js/universal",
              "@sanbus/galley-node": "file:${{ github.workspace }}/bindings/js/node",
              "@sanbus/galley-wasm": "file:${{ github.workspace }}/bindings/js/wasm"
            },
            "devDependencies": {
              "vite": "7.3.6",
              "webpack": "5.110.3",
              "webpack-cli": "6.0.1"
            }
          }
          EOF
          (cd "$MATRIX" && npm install --no-audit --no-fund)
          node bindings/js/node/build.mjs "$MATRIX/grammar"
          node "$MATRIX/serve.mjs" "$MATRIX/grammar/libgalley-js-wasm.wasm" 8123 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID' EXIT
          # Every branch below must be an `if`: under `bash -e` a failed
          # `! grep` never exits (negation suppresses -e) and the function
          # would return only its last line, going green on a leak.
          check_node_bundle() {
            local bundle="$1" status=0
            if ! grep -q 'tried native library' "$bundle"; then
              echo "loader missing in $bundle (default import resolved to the browser entry?)"
              status=1
            fi
            return "$status"
          }
          check_browser_bundle() {
            local bundle="$1" status=0
            if ! grep -q 'using the WebAssembly backend' "$bundle"; then
              echo "browser notice missing in $bundle"
              status=1
            fi
            if grep -q 'tried native library' "$bundle"; then
              echo "loader leaked into $bundle"
              status=1
            fi
            if grep -q '"node:' "$bundle"; then
              echo "node: specifier in $bundle"
              status=1
            fi
            if grep -q "'node:" "$bundle"; then
              echo "node: specifier in $bundle"
              status=1
            fi
            return "$status"
          }
          # Default entry targets node (it needs node: builtins and must
          # resolve the `import` condition to the loader, not the `browser`
          # condition to the wasm entry). The browser entry targets web.
          (cd "$MATRIX" && ./node_modules/.bin/vite build --ssr app-default.mjs --outDir dist-vite-default)
          mv "$MATRIX/dist-vite-default/app-default.js" "$MATRIX/dist-vite-default/app.bundle.js"
          (cd "$MATRIX" && MATRIX_ENTRY=app-subpath.mjs MATRIX_OUT=dist-vite-subpath ./node_modules/.bin/vite build)
          (cd "$MATRIX" && MATRIX_ENTRY=./app-default.mjs MATRIX_OUT=dist-webpack-default MATRIX_TARGET=node ./node_modules/.bin/webpack --config webpack.config.js)
          (cd "$MATRIX" && MATRIX_ENTRY=./app-subpath.mjs MATRIX_OUT=dist-webpack-subpath ./node_modules/.bin/webpack --config webpack.config.js)
          check_node_bundle "$MATRIX/dist-vite-default/app.bundle.js" || exit 1
          check_browser_bundle "$MATRIX/dist-vite-subpath/app.bundle.js" || exit 1
          check_node_bundle "$MATRIX/dist-webpack-default/app.bundle.cjs" || exit 1
          check_browser_bundle "$MATRIX/dist-webpack-subpath/app.bundle.js" || exit 1
          # Assignment prefixes never glob-expand, so resolve the artifact
          # into an array first (linux builds `.so`, macOS `.dylib`).
          NATIVE_LIB=( "$MATRIX"/grammar/libgalley-js-node.* )
          node_output=$(GALLEY_LIBRARY_PATH="${NATIVE_LIB[0]}" node "$MATRIX/dist-vite-default/app.bundle.js") || exit 1
          echo "$node_output"
          if echo "$node_output" | grep -q 'WebAssembly'; then
            echo "vite node bundle fell back to wasm instead of serving native"
            exit 1
          fi
          if ! echo "$node_output" | grep -q 'parsed 15 bytes'; then
            echo "vite node bundle did not parse"
            exit 1
          fi
          node "$MATRIX/dist-vite-subpath/app.bundle.js" || exit 1
          node "$MATRIX/dist-webpack-subpath/app.bundle.js" || exit 1
          # No runtime leg for the webpack node bundle: webpack replaces the
          # loader's expression require/import legs with stubs that always
          # throw, so adapters cannot load from it. The vite SSR cell above
          # covers the node runtime path end to end.

      - name: Run universal example on Node, Bun, and Deno
        env:
          GALLEY_CHECKOUT: ${{ github.workspace }}
        run: |
          cd examples/js/universal
          npm install --install-links --no-audit --no-fund
          npx galley build .
          npx tsx demo.ts >/tmp/out-universal-node.txt 2>/tmp/err-universal-node.txt
          bun demo.ts >/tmp/out-universal-bun.txt 2>/tmp/err-universal-bun.txt
          deno run --allow-ffi --allow-read --allow-write --allow-env demo.ts >/tmp/out-universal-deno.txt 2>/tmp/err-universal-deno.txt
          diff /tmp/out-universal-node.txt /tmp/out-universal-bun.txt
          diff /tmp/out-universal-node.txt /tmp/out-universal-deno.txt
          diff /tmp/err-universal-node.txt /tmp/err-universal-bun.txt
          diff /tmp/err-universal-node.txt /tmp/err-universal-deno.txt
          GALLEY_WASM=1 npx tsx demo.ts >/tmp/out-universal-wasm.txt 2>/tmp/err-universal-wasm.txt
          GALLEY_WASM=1 bun demo.ts >/tmp/out-universal-wasm-bun.txt 2>/tmp/err-universal-wasm-bun.txt
          GALLEY_WASM=1 deno run --allow-ffi --allow-read --allow-write --allow-env demo.ts >/tmp/out-universal-wasm-deno.txt 2>/tmp/err-universal-wasm-deno.txt
          diff /tmp/out-universal-node.txt /tmp/out-universal-wasm.txt
          diff /tmp/err-universal-node.txt /tmp/err-universal-wasm.txt
          diff /tmp/out-universal-wasm.txt /tmp/out-universal-wasm-bun.txt
          diff /tmp/out-universal-wasm.txt /tmp/out-universal-wasm-deno.txt
          diff /tmp/err-universal-wasm.txt /tmp/err-universal-wasm-bun.txt
          diff /tmp/err-universal-wasm.txt /tmp/err-universal-wasm-deno.txt

  compiler-cli:
    name: compiler-cli
    runs-on: ${{ contains(github.server_url, 'github') && 'ubuntu-latest' || 'codeberg-medium' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Zig
        run: |
          URL=$(curl -s https://ziglang.org/download/index.json | jq -r '."0.16.0"."x86_64-linux".tarball')
          curl -L "$URL" -o zig.tar.xz
          tar -xf zig.tar.xz
          echo "$PWD/zig-x86_64-linux-0.16.0" >>$GITHUB_PATH

      - name: Install Node
        uses: actions/setup-node@v6
        with:
          node-version: 26

      - name: Build every compiler target
        run: ./scripts/js/build_compiler_binaries.sh "${{ github.workspace }}" /tmp/galley-cli

      - name: Check architectures and health
        run: |
          expect_arch() {
            if ! file "$1" | grep -E -q "$2"; then
              echo "$1 is not $2:"; file "$1"
              exit 1
            fi
          }
          expect_arch /tmp/galley-cli/cli-darwin-arm64/bin/galley "[Aa][Rr][Mm]64"
          expect_arch /tmp/galley-cli/cli-darwin-x64/bin/galley "x86_64|x86-64"
          expect_arch /tmp/galley-cli/cli-linux-x64/bin/galley "x86-64"
          expect_arch /tmp/galley-cli/cli-linux-arm64/bin/galley "aarch64"
          expect_arch /tmp/galley-cli/cli-win32-x64/bin/galley.exe "PE32|x86-64"
          expect_arch /tmp/galley-cli/cli-win32-arm64/bin/galley.exe "Aarch64|aarch64"
          # Minimal healthcheck, not the suite: the binary matching this
          # runner must start and answer. Foreign targets cannot execute
          # here; their turn comes from matching runners.
          if ! /tmp/galley-cli/cli-linux-x64/bin/galley --help 2>&1 | grep -q 'usage:'; then
            echo "linux-x64 CLI failed its healthcheck"
            exit 1
          fi

      - name: Install and build JavaScript bindings
        run: |
          npm --prefix bindings/js install --no-audit --no-fund
          npm run build --prefix bindings/js
          npm --prefix bindings/js/universal install --no-audit --no-fund

      - name: Prove generation with no checkout
        run: |
          rm -rf /tmp/cli-proof && mkdir -p /tmp/cli-proof/grammar
          cp bindings/js/test-fixture/ll.grm /tmp/cli-proof/grammar/ll.grm
          (cd "${{ github.workspace }}" && zig build -Doptimize=ReleaseFast galley)
          ./zig-out/bin/galley --emit-metadata /tmp/cli-proof/grammar
          # file: optionalDependencies install as symlinks, so the platform
          # package resolves to this repo dir; stage the binary there.
          mkdir -p bindings/js/cli-linux-x64/bin
          cp /tmp/galley-cli/cli-linux-x64/bin/galley bindings/js/cli-linux-x64/bin/galley
          rm -rf /tmp/cli-proof/nocheckout && mkdir -p /tmp/cli-proof/nocheckout
          cp bindings/js/test-fixture/ll.grm /tmp/cli-proof/nocheckout/ll.grm
          # The real bin, not the resolver directly: generation must use the
          # platform package, then compiling must fail loudly naming the
          # checkout it still needs.
          if env -u GALLEY_CHECKOUT node bindings/js/universal/build.mjs build /tmp/cli-proof/nocheckout --wasm-only 2>/tmp/cli-proof/stderr.txt; then
            echo "galley build without a checkout unexpectedly compiled"
            exit 1
          fi
          grep -q 'GALLEY_CHECKOUT' /tmp/cli-proof/stderr.txt || exit 1
          for generated in _ll-parser.zig _lr-parser.zig metadata.json; do
            if [ -f /tmp/cli-proof/grammar/$generated ]; then
              cmp /tmp/cli-proof/grammar/$generated /tmp/cli-proof/nocheckout/$generated || exit 1
            fi
          done
          rm -rf bindings/js/cli-linux-x64/bin

  publish:
    name: publish
    if: ${{ github.server_url == 'https://github.com' && github.ref_type == 'tag' && startsWith(github.ref_name, 'v') }}
    needs:
      - test
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Node
        uses: actions/setup-node@v6
        with:
          node-version: 26
          registry-url: https://registry.npmjs.org

      - name: Verify tag matches the single Galley version
        run: test "${GITHUB_REF_NAME#v}" = "$(python3 scripts/product_version.py)"

      - name: Install and build JavaScript bindings
        run: |
          npm --prefix bindings/js install --no-audit --no-fund
          npm run build --prefix bindings/js
          npm --prefix bindings/js/universal install --no-audit --no-fund

      - name: Install Zig
        run: |
          URL=$(curl -s https://ziglang.org/download/index.json | jq -r '."0.16.0"."x86_64-linux".tarball')
          curl -L "$URL" -o zig.tar.xz
          tar -xf zig.tar.xz
          echo "$PWD/zig-x86_64-linux-0.16.0" >>$GITHUB_PATH

      - name: Build every compiler target
        run: ./scripts/js/build_compiler_binaries.sh "${{ github.workspace }}" "${{ runner.temp }}/galley-cli"

      - name: Publish JavaScript packages
        env:
          CLI_ARTIFACTS: ${{ runner.temp }}/galley-cli
        run: ./scripts/js/publish_js.sh

  publish-rust:
    name: publish-rust
    if: ${{ github.server_url == 'https://github.com' && github.ref_type == 'tag' && startsWith(github.ref_name, 'v') }}
    needs:
      - test
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
