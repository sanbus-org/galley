name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  core:
    name: core
    runs-on: ${{ contains(github.server_url, 'github') && 'ubuntu-latest' || 'codeberg-medium' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Zig
        run: |
          URL=$(curl -s https://ziglang.org/download/index.json | jq -r '."0.16.0"."x86_64-linux".tarball')
          curl -L "$URL" -o zig.tar.xz
          tar -xf zig.tar.xz
          echo "$PWD/zig-x86_64-linux-0.16.0" >>$GITHUB_PATH

      - name: Verify package consumer
        run: zig build -j1 test-package-consumer --summary all

      - name: Run core test suites
        run: |
          zig build -j1 test \
            --summary all \
            --test-timeout 30m \
            -Dtest-filter=suite:build \
            -Dtest-filter=suite:generator \
            -Dtest-filter=suite:runtime \
            -Dtest-filter=suite:galley-parity

  matrix:
    name: matrix (${{ matrix.case }})
    runs-on: ${{ contains(github.server_url, 'github') && 'ubuntu-latest' || 'codeberg-medium' }}
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        case:
          - ll-galley
          - lr-galley
          - ll-json-structured-ast
          - lr-json-structured-ast
          - ll-json
          - lr-json
          - ll-json-augmented
          - ll-json-recovery
          - lr-json-recovery
          - ll-lisp
          - ll-indentation
          - ll-lua
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Fetch large sample fixtures
        run: |
          case="${{ matrix.case }}"
          bash scripts/fetch-large-samples.sh "${case#*-}"

      - name: Install Zig
        run: |
          URL=$(curl -s https://ziglang.org/download/index.json | jq -r '."0.16.0"."x86_64-linux".tarball')
          curl -L "$URL" -o zig.tar.xz
          tar -xf zig.tar.xz
          echo "$PWD/zig-x86_64-linux-0.16.0" >>$GITHUB_PATH

      - name: Run parser test case
        run: |
          zig build -j1 test \
            --summary all \
            --test-timeout 30m \
            -Dtest-filter=case:${{ matrix.case }}

  language-examples:
    name: language-examples (${{ matrix.language }})
    runs-on: ${{ contains(github.server_url, 'github') && 'ubuntu-latest' || 'codeberg-medium' }}
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        language:
          - c
          - cpp
          - rust
          - go
          - python
          - typescript
          - zig
          - java
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Zig
        run: |
          URL=$(curl -s https://ziglang.org/download/index.json | jq -r '."0.16.0"."x86_64-linux".tarball')
          curl -L "$URL" -o zig.tar.xz
          tar -xf zig.tar.xz
          echo "$PWD/zig-x86_64-linux-0.16.0" >>$GITHUB_PATH

      - name: Install Go
        if: ${{ matrix.language == 'go' }}
        uses: actions/setup-go@v6
        with:
          go-version: stable
          cache: false

      - name: Install Node
        if: ${{ matrix.language == 'typescript' }}
        uses: actions/setup-node@v6
        with:
          node-version: 26

      - name: Install Python
        if: ${{ matrix.language == 'python' }}
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install Java
        if: ${{ matrix.language == 'java' }}
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 22

      - name: Build and run example (cmake)
        if: ${{ matrix.language == 'c' || matrix.language == 'cpp' }}
        run: |
          cmake -S examples/${{ matrix.language }} -B build-${{ matrix.language }} \
            -DCMAKE_BUILD_TYPE=Release -DGALLEY_CHECKOUT="$GITHUB_WORKSPACE"
          cmake --build build-${{ matrix.language }}
          ./build-${{ matrix.language }}/bin/demo

      - name: Build and run example (cargo)
        if: ${{ matrix.language == 'rust' }}
        run: |
          GALLEY_CHECKOUT="$GITHUB_WORKSPACE" \
            cargo run --release --manifest-path examples/rust/Cargo.toml

      - name: Test bindings (cargo)
        if: ${{ matrix.language == 'rust' }}
        run: cargo test --release --manifest-path bindings/rust/Cargo.toml

      - name: Build and run example (go)
        if: ${{ matrix.language == 'go' }}
        working-directory: examples/go
        env:
          GALLEY_CHECKOUT: ${{ github.workspace }}
        run: |
          go generate ./...
          go build -o galley-go-example ./demo
          ./galley-go-example

      - name: Test bindings (go)
        if: ${{ matrix.language == 'go' }}
        working-directory: examples/go
        env:
          GALLEY_CHECKOUT: ${{ github.workspace }}
        run: |
          go test -count=1 ./...
      - name: Build and run example (python)
        if: ${{ matrix.language == 'python' }}
        working-directory: examples/python
        env:
          GALLEY_CHECKOUT: ${{ github.workspace }}
        run: |
          pip install -e .
          python -m galley_bindings .
          python demo.py
          PYTHONPATH="$PWD" python ../../bindings/python/tests/test_bindings.py

      - name: Build and run example (typescript)
        if: ${{ matrix.language == 'typescript' }}
        working-directory: examples/typescript
        env:
          GALLEY_CHECKOUT: ${{ github.workspace }}
        run: |
          npm install
          npx galley-typescript-bindings .
          npx tsx demo.ts
          node ../../bindings/typescript/tests/test_bindings.mjs

      - name: Build and run example (zig)
        if: ${{ matrix.language == 'zig' }}
        working-directory: examples/zig
        run: zig build run

      - name: Build and run example (java)
        if: ${{ matrix.language == 'java' }}
        env:
          GALLEY_CHECKOUT: ${{ github.workspace }}
        run: |
          javac --release 22 -d bindings/java/out $(find bindings/java/src/main/java -name "*.java")
          java --enable-native-access=ALL-UNNAMED -cp bindings/java/out org.sanbus.galley.build.GalleyBuild examples/java
          javac --release 22 -cp bindings/java/out -d examples/java/out $(find examples/java/src/main/java -name "*.java")
          java --enable-native-access=ALL-UNNAMED -cp bindings/java/out:examples/java/out com.example.Demo

  bindings-consistency:
    name: bindings-consistency
    runs-on: ${{ contains(github.server_url, 'github') && 'ubuntu-latest' || 'codeberg-medium' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Zig
        run: |
          URL=$(curl -s https://ziglang.org/download/index.json | jq -r '."0.16.0"."x86_64-linux".tarball')
          curl -L "$URL" -o zig.tar.xz
          tar -xf zig.tar.xz
          echo "$PWD/zig-x86_64-linux-0.16.0" >>$GITHUB_PATH

      - name: Install Go
        uses: actions/setup-go@v6
        with:
          go-version: stable
          cache: false

      - name: Install Node
        uses: actions/setup-node@v6
        with:
          node-version: 26

      - name: Install Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 22

      - name: Grammar, options, and error messages are identical across bindings
        run: |
          same() {
            name="$1"
            shift
            unique=$(sha256sum "$@" | awk '{print $1}' | sort -u)
            count=$(printf '%s\n' "$unique" | wc -l)
            echo "$name: $count distinct variants"
            test "$count" = 1 || { echo "::error::$name differs across examples"; exit 1; }
          }
          same ll.grm examples/{c,cpp,rust,python,typescript,zig,java}/ll.grm examples/go/demo/ll.grm
          same config.zig examples/{c,cpp,rust,python,typescript,zig,java}/config.zig examples/go/demo/config.zig
          same ll_error_messages.zig examples/*/ll_error_messages.zig
          same benchmark/ll.grm examples/*/benchmark/ll.grm
          same benchmark/config.zig examples/*/benchmark/config.zig
          for f in examples/*/benchmark/ll.grm; do
            test -L "$f" || {
              echo "::error::$f must be a symlink to languages/json/ll.grm"
              exit 1
            }
          done
          cmp -s languages/json/ll.grm examples/c/benchmark/ll.grm || {
            echo "::error::examples/*/benchmark/ll.grm must match languages/json/ll.grm"
            exit 1
          }

      - name: Galley checkout resolution is consistent across bindings
        run: |
          check() {
            file="$1"
            for var in GALLEY_CHECKOUT GALLEY_REPOSITORY GALLEY_TAG ZIG_EXECUTABLE; do
              if ! grep -q "$var" "$file"; then
                echo "::error::$file missing $var handling (Galley checkout contract)"
                exit 1
              fi
            done
            echo "Galley fetch contract present in $file"
          }
          check bindings/go/cmd/galley/main.go
          check bindings/rust/src/build_helper.rs
          check bindings/python/galley_bindings/build.py
          check bindings/typescript/build.mjs
          check bindings/java/src/main/java/org/sanbus/galley/build/GalleyBuild.java
          for f in examples/c/CMakeLists.txt examples/cpp/CMakeLists.txt; do
            check "$f"
          done
          echo "Galley checkout contract enforced in all bindings"

      - name: Generated parser artifacts are identical across bindings
        run: |
          zig build -Doptimize=ReleaseFast install
          for lang in c cpp rust python typescript java; do
            ./zig-out/bin/galley --emit-metadata "examples/$lang" >/dev/null
          done
          ./zig-out/bin/galley "examples/zig" >/dev/null
          unique=$(sha256sum examples/{c,cpp,rust,python,typescript,zig,java}/_ll-parser.zig | awk '{print $1}' | sort -u)
          count=$(printf '%s\n' "$unique" | wc -l)
          echo "_ll-parser.zig: $count distinct variants"
          test "$count" = 1 || { echo "::error::generated _ll-parser.zig differs across examples despite identical grammar and options"; exit 1; }
          unique=$(sha256sum examples/{c,cpp,rust,python,typescript,java}/procedures.zig | awk '{print $1}' | sort -u)
          count=$(printf '%s\n' "$unique" | wc -l)
          echo "procedures.zig: $count distinct variants"
          test "$count" = 1 || { echo "::error::generated procedures.zig differs across bindings despite identical grammar and options"; exit 1; }

      - name: Procedure entry points are identical across bindings
        run: |
          names() {
            grep -hoE '\b(hook_|reduction)[A-Za-z0-9_]*[[:space:]]*\(' "$1" | tr -d ' \t(' | sort -u
          }
          names examples/c/procedures.c > /tmp/names-c.txt
          names examples/cpp/procedures.cpp > /tmp/names-cpp.txt
          names examples/rust/procedures.rs > /tmp/names-rust.txt
          names examples/go/demo/procedures.go > /tmp/names-go.txt
          names examples/python/procedures.py > /tmp/names-python.txt
          names examples/typescript/procedures.ts > /tmp/names-typescript.txt
          names examples/java/procedures.java > /tmp/names-java.txt
          diff /tmp/names-c.txt /tmp/names-cpp.txt || { echo "::error::C and C++ procedure entry points differ"; exit 1; }
          diff /tmp/names-c.txt /tmp/names-rust.txt || { echo "::error::C and Rust procedure entry points differ"; exit 1; }
          diff /tmp/names-c.txt /tmp/names-go.txt || { echo "::error::C and Go procedure entry points differ"; exit 1; }
          diff /tmp/names-c.txt /tmp/names-python.txt || { echo "::error::C and Python procedure entry points differ"; exit 1; }
          diff /tmp/names-c.txt /tmp/names-typescript.txt || { echo "::error::C and TypeScript procedure entry points differ"; exit 1; }
          diff /tmp/names-c.txt /tmp/names-java.txt || { echo "::error::C and Java procedure entry points differ"; exit 1; }
          names examples/zig/procedures.zig > /tmp/names-zig.txt
          diff /tmp/names-c.txt /tmp/names-zig.txt || { echo "::error::C and Zig procedure entry points differ"; exit 1; }
          echo "procedure entry points ($(wc -l < /tmp/names-c.txt)) are identical across all bindings"

      - name: LR family builds through the c abi
        run: |
          work=/tmp/galley-lr-smoke
          rm -rf "$work" && mkdir -p "$work"
          cp examples/c/ll.grm "$work/lr.grm"
          cp examples/c/config.zig examples/c/procedures.c "$work/"
          ./zig-out/bin/galley --parser-type lr --emit-metadata "$work" >/dev/null
          zig build --build-file bindings/c/consumer/build.zig \
            "-Dparser-source=$work/_lr-parser.zig" \
            "-Dparser-type=lr" \
            -Dlib-name=keyvalue-lr -Doptimize=ReleaseFast \
            --prefix "$work/out" install
          cat > "$work/driver.c" <<'EOF'
          #include <galley.h>
          #include <stdio.h>
          int main(void) {
              if (galley_parser_type() != galley_parser_type_lr) {
                  fprintf(stderr, "expected an lr library\n");
                  return 1;
              }
              GalleySession *session = galley_session_create();
              long long parsed = galley_parse_sentinel(session, "alpha:12,beta:3");
              if (parsed != 15 || galley_node_count(session) == 0) {
                  fprintf(stderr, "lr parse failed (parsed=%lld)\n", parsed);
                  return 1;
              }
              const char *message = NULL;
              galley_parse_sentinel(session, "alpha:");
              if (galley_diagnostic_message(session, &message) != galley_ok || message == NULL) {
                  fprintf(stderr, "expected a diagnostic for the broken sample\n");
                  return 1;
              }
              printf("lr smoke ok: parsed %lld bytes, %llu nodes\n", parsed, galley_node_count(session));
              galley_session_destroy(session);
              return 0;
          }
          EOF
          cc "$work/driver.c" -I"$work/out/include" -L"$work/out/lib" \
            -lkeyvalue-lr -Wl,-rpath,"$work/out/lib" -o "$work/driver"
          "$work/driver"

      - name: Example output is identical across bindings
        run: |
          for lang in c cpp; do
            cmake -S examples/$lang -B /tmp/build-$lang -DCMAKE_BUILD_TYPE=Release -DGALLEY_CHECKOUT="$PWD" >/dev/null
            cmake --build /tmp/build-$lang >/dev/null
          done
          GALLEY_CHECKOUT="$PWD" cargo build --release --manifest-path examples/rust/Cargo.toml >/dev/null
          cd examples/go
          GALLEY_CHECKOUT="$PWD/../.." go generate ./...
          go build -o /tmp/example-go ./demo
          cd ../..
          cd examples/python
          pip install -e . >/dev/null
          GALLEY_CHECKOUT="$PWD/../.." python -m galley_bindings . >/dev/null
          python demo.py >/tmp/out-python.txt 2>/tmp/err-python.txt
          cd ../..
          cd examples/typescript
          npm install >/dev/null 2>&1
          GALLEY_CHECKOUT="$PWD/../.." npx galley-typescript-bindings . >/dev/null
          npx tsx demo.ts >/tmp/out-typescript.txt 2>/tmp/err-typescript.txt
          cd ../..
          cd examples/zig
          zig build
          zig-out/bin/demo >/tmp/out-zig.txt 2>/tmp/err-zig.txt
          cd ../..
          javac --release 22 -d bindings/java/out $(find bindings/java/src/main/java -name "*.java")
          java --enable-native-access=ALL-UNNAMED -cp bindings/java/out org.sanbus.galley.build.GalleyBuild examples/java
          javac --release 22 -cp bindings/java/out -d examples/java/out $(find examples/java/src/main/java -name "*.java")
          java --enable-native-access=ALL-UNNAMED -cp bindings/java/out:examples/java/out com.example.Demo >/tmp/out-java.txt 2>/tmp/err-java.txt

          /tmp/build-c/bin/demo >/tmp/out-c.txt 2>/tmp/err-c.txt
          /tmp/build-cpp/bin/demo >/tmp/out-cpp.txt 2>/tmp/err-cpp.txt
          examples/rust/target/release/galley-rust-example >/tmp/out-rust.txt 2>/tmp/err-rust.txt
          /tmp/example-go >/tmp/out-go.txt 2>/tmp/err-go.txt

          compare() {
            if ! diff -u "$1" "$2"; then
              echo "::error::example output differs ($1 vs $2)"
              echo "===== $1 ====="; cat "$1"
              echo "===== $2 ====="; cat "$2"
              exit 1
            fi
          }
          compare /tmp/out-c.txt /tmp/out-cpp.txt
          compare /tmp/out-c.txt /tmp/out-rust.txt
          compare /tmp/out-c.txt /tmp/out-go.txt
          compare /tmp/out-c.txt /tmp/out-python.txt
          compare /tmp/out-c.txt /tmp/out-typescript.txt
          compare /tmp/out-c.txt /tmp/out-zig.txt
          compare /tmp/out-c.txt /tmp/out-java.txt
          compare /tmp/err-c.txt /tmp/err-cpp.txt
          compare /tmp/err-c.txt /tmp/err-rust.txt
          compare /tmp/err-c.txt /tmp/err-go.txt
          compare /tmp/err-c.txt /tmp/err-python.txt
          compare /tmp/err-c.txt /tmp/err-typescript.txt
          compare /tmp/err-c.txt /tmp/err-zig.txt
          compare /tmp/err-c.txt /tmp/err-java.txt
          echo "example output ($(wc -l < /tmp/out-c.txt) stdout lines, $(wc -l < /tmp/err-c.txt) stderr lines) is identical across all bindings"

  example-benchmarks:
    name: example-benchmarks
    runs-on: ${{ contains(github.server_url, 'github') && 'ubuntu-latest' || 'codeberg-medium' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Fetch large JSON sample
        run: bash scripts/fetch-large-samples.sh json

      - name: Install Zig
        run: |
          URL=$(curl -s https://ziglang.org/download/index.json | jq -r '."0.16.0"."x86_64-linux".tarball')
          curl -L "$URL" -o zig.tar.xz
          tar -xf zig.tar.xz
          echo "$PWD/zig-x86_64-linux-0.16.0" >>$GITHUB_PATH

      - name: Install Go
        uses: actions/setup-go@v6
        with:
          go-version: stable
          cache: false

      - name: Install Node
        uses: actions/setup-node@v6
        with:
          node-version: 26

      - name: Install Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 22

      - name: Build example benchmarks
        env:
          GALLEY_CHECKOUT: ${{ github.workspace }}
        run: |
          javac --release 22 -d bindings/java/out $(find bindings/java/src/main/java -name "*.java")
          java --enable-native-access=ALL-UNNAMED -cp bindings/java/out org.sanbus.galley.build.GalleyBuild examples/java/benchmark
          javac --release 22 -cp bindings/java/out -d examples/java/out $(find examples/java/src/main/java -name "*.java")
          cmake -S examples/c -B /tmp/build-c -DCMAKE_BUILD_TYPE=Release -DGALLEY_CHECKOUT="$PWD"
          cmake --build /tmp/build-c --target benchmark
          cmake -S examples/cpp -B /tmp/build-cpp -DCMAKE_BUILD_TYPE=Release -DGALLEY_CHECKOUT="$PWD"
          cmake --build /tmp/build-cpp --target benchmark
          cargo build --release --manifest-path examples/rust/Cargo.toml -p galley-rust-benchmark
          cd examples/go
          go generate ./...
          go build -o /tmp/galley-go-benchmark ./benchmark
          cd ../python
          pip install -e .
          python -m galley_bindings benchmark
          cd ../typescript
          npm install
          npx galley-typescript-bindings benchmark
          cd ../zig
          zig build -Doptimize=ReleaseFast
          cd ../..

      - name: Compare interleaved throughput to examples/zig
        env:
          GALLEY_CHECKOUT: ${{ github.workspace }}
        run: python3 scripts/compare_example_benchmarks.py

  test:
    name: test
    if: ${{ always() }}
    needs:
      - core
      - matrix
      - language-examples
      - bindings-consistency
      - example-benchmarks
    runs-on: ${{ contains(github.server_url, 'github') && 'ubuntu-latest' || 'codeberg-medium' }}
    steps:
      - name: Verify CI results
        env:
          CORE_RESULT: ${{ needs.core.result }}
          MATRIX_RESULT: ${{ needs.matrix.result }}
          LANGUAGE_EXAMPLES_RESULT: ${{ needs.language-examples.result }}
          BINDINGS_CONSISTENCY_RESULT: ${{ needs.bindings-consistency.result }}
          EXAMPLE_BENCHMARKS_RESULT: ${{ needs.example-benchmarks.result }}
        run: |
          echo "core: $CORE_RESULT"
          echo "matrix: $MATRIX_RESULT"
          echo "language-examples: $LANGUAGE_EXAMPLES_RESULT"
          echo "bindings-consistency: $BINDINGS_CONSISTENCY_RESULT"
          echo "example-benchmarks: $EXAMPLE_BENCHMARKS_RESULT"
          test "$CORE_RESULT" = success
          test "$MATRIX_RESULT" = success
          test "$LANGUAGE_EXAMPLES_RESULT" = success
          test "$BINDINGS_CONSISTENCY_RESULT" = success
          test "$EXAMPLE_BENCHMARKS_RESULT" = success
