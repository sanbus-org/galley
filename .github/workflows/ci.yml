name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  core:
    name: core
    runs-on: ${{ contains(github.server_url, 'github') && 'ubuntu-latest' || 'codeberg-medium' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Zig
        run: |
          URL=$(curl -s https://ziglang.org/download/index.json | jq -r '."0.16.0"."x86_64-linux".tarball')
          curl -L "$URL" -o zig.tar.xz
          tar -xf zig.tar.xz
          echo "$PWD/zig-x86_64-linux-0.16.0" >>$GITHUB_PATH

      - name: Verify package consumer
        run: zig build -j1 test-package-consumer --summary all

      - name: Run core test suites
        run: |
          zig build -j1 test \
            --summary all \
            --test-timeout 30m \
            -Dtest-filter=suite:build \
            -Dtest-filter=suite:generator \
            -Dtest-filter=suite:runtime \
            -Dtest-filter=suite:galley-parity

  matrix:
    name: matrix (${{ matrix.case }})
    runs-on: ${{ contains(github.server_url, 'github') && 'ubuntu-latest' || 'codeberg-medium' }}
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        case:
          - ll-galley
          - lr-galley
          - ll-json-structured-ast
          - lr-json-structured-ast
          - ll-json
          - lr-json
          - ll-json-augmented
          - ll-json-recovery
          - lr-json-recovery
          - ll-lisp
          - ll-indentation
          - ll-lua
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Fetch large sample fixtures
        run: |
          case="${{ matrix.case }}"
          bash scripts/fetch-large-samples.sh "${case#*-}"

      - name: Install Zig
        run: |
          URL=$(curl -s https://ziglang.org/download/index.json | jq -r '."0.16.0"."x86_64-linux".tarball')
          curl -L "$URL" -o zig.tar.xz
          tar -xf zig.tar.xz
          echo "$PWD/zig-x86_64-linux-0.16.0" >>$GITHUB_PATH

      - name: Run parser test case
        run: |
          zig build -j1 test \
            --summary all \
            --test-timeout 30m \
            -Dtest-filter=case:${{ matrix.case }}

  language-examples:
    name: language-examples (${{ matrix.language }})
    runs-on: ${{ contains(github.server_url, 'github') && 'ubuntu-latest' || 'codeberg-medium' }}
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        language:
          - c
          - cpp
          - rust
          - go
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Zig
        run: |
          URL=$(curl -s https://ziglang.org/download/index.json | jq -r '."0.16.0"."x86_64-linux".tarball')
          curl -L "$URL" -o zig.tar.xz
          tar -xf zig.tar.xz
          echo "$PWD/zig-x86_64-linux-0.16.0" >>$GITHUB_PATH

      - name: Install Go
        if: ${{ matrix.language == 'go' }}
        uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Build and run example (cmake)
        if: ${{ matrix.language != 'rust' && matrix.language != 'go' }}
        run: |
          cmake -S examples/${{ matrix.language }} -B build-${{ matrix.language }} \
            -DGALLEY_CHECKOUT="$GITHUB_WORKSPACE"
          cmake --build build-${{ matrix.language }}
          ./build-${{ matrix.language }}/bin/example

      - name: Build and run example (cargo)
        if: ${{ matrix.language == 'rust' }}
        run: |
          GALLEY_CHECKOUT="$GITHUB_WORKSPACE" \
            cargo run --release --manifest-path examples/rust/Cargo.toml

      - name: Build and run example (go)
        if: ${{ matrix.language == 'go' }}
        working-directory: examples/go
        env:
          GALLEY_CHECKOUT: ${{ github.workspace }}
        run: |
          go generate ./...
          go build -o galley-go-example .
          ./galley-go-example

  bindings-consistency:
    name: bindings-consistency
    runs-on: ${{ contains(github.server_url, 'github') && 'ubuntu-latest' || 'codeberg-medium' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Zig
        run: |
          URL=$(curl -s https://ziglang.org/download/index.json | jq -r '."0.16.0"."x86_64-linux".tarball')
          curl -L "$URL" -o zig.tar.xz
          tar -xf zig.tar.xz
          echo "$PWD/zig-x86_64-linux-0.16.0" >>$GITHUB_PATH

      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Grammar, options, and error messages are identical across bindings
        run: |
          for file in ll.grm galley.json ll_error_messages.zig; do
            unique=$(sha256sum examples/*/"$file" | awk '{print $1}' | sort -u)
            count=$(printf '%s\n' "$unique" | wc -l)
            echo "$file: $count distinct variants"
            test "$count" = 1 || { echo "::error::$file differs across examples/c, examples/cpp, examples/rust"; exit 1; }
          done

      - name: Generated parser artifacts are identical across bindings
        run: |
          zig build -Doptimize=ReleaseFast install
          for lang in c cpp rust; do
            ./zig-out/bin/galley --emit-metadata "examples/$lang" >/dev/null
          done
          for file in _ll-parser.zig procedures.zig; do
            unique=$(sha256sum examples/*/"$file" | awk '{print $1}' | sort -u)
            count=$(printf '%s\n' "$unique" | wc -l)
            echo "$file: $count distinct variants"
            test "$count" = 1 || { echo "::error::generated $file differs across bindings despite identical grammar and options"; exit 1; }
          done

      - name: Procedure entry points are identical across bindings
        run: |
          names() {
            grep -hoE '\b(hook_|reduction)[A-Za-z0-9_]*[[:space:]]*\(' "$1" | tr -d ' \t(' | sort -u
          }
          names examples/c/procedures.c > /tmp/names-c.txt
          names examples/cpp/procedures.cpp > /tmp/names-cpp.txt
          names examples/rust/procedures.rs > /tmp/names-rust.txt
          names examples/go/hooks/procedures.c > /tmp/names-go.txt
          diff /tmp/names-c.txt /tmp/names-cpp.txt || { echo "::error::C and C++ procedure entry points differ"; exit 1; }
          diff /tmp/names-c.txt /tmp/names-rust.txt || { echo "::error::C and Rust procedure entry points differ"; exit 1; }
          diff /tmp/names-c.txt /tmp/names-go.txt || { echo "::error::C and Go procedure entry points differ"; exit 1; }
          echo "procedure entry points ($(wc -l < /tmp/names-c.txt)) are identical across all bindings"

      - name: LR family builds through the c abi
        run: |
          # The examples pin the ll family; this smoke exercises the lr half
          # of the same contract with the same grammar: generation, consumer
          # build with -Dparser-type=lr, capi behavior, hooks, and
          # diagnostics. No separate lr fixture exists — the canonical
          # binding grammar is the examples' pinned one.
          work=/tmp/galley-lr-smoke
          rm -rf "$work" && mkdir -p "$work"
          cp examples/c/ll.grm "$work/lr.grm"
          cp examples/c/galley.json examples/c/procedures.c "$work/"
          ./zig-out/bin/galley --parser-type lr --emit-metadata "$work" >/dev/null
          zig build --build-file bindings/c/consumer/build.zig \
            "-Dparser-source=$work/_lr-parser.zig" \
            "-Dparser-type=lr" \
            "-Dprocedures-zig-source=$work/procedures.zig" \
            "-Dprocedures-c-source=$work/procedures.c" \
            "-Derror-messages-zig-source=$work/lr_error_messages.zig" \
            -Dlib-name=keyvalue-lr -Doptimize=ReleaseFast \
            --prefix "$work/out" install
          cat > "$work/driver.c" <<'EOF'
          #include <galley.h>
          #include <stdio.h>
          int main(void) {
              if (galley_parser_type() != galley_parser_type_lr) {
                  fprintf(stderr, "expected an lr library\n");
                  return 1;
              }
              GalleySession *session = galley_session_create();
              long long parsed = galley_parse_sentinel(session, "alpha:12,beta:3");
              if (parsed != 15 || galley_node_count(session) == 0) {
                  fprintf(stderr, "lr parse failed (parsed=%lld)\n", parsed);
                  return 1;
              }
              const char *message = NULL;
              galley_parse_sentinel(session, "alpha:");
              if (galley_diagnostic_message(session, &message) != galley_ok || message == NULL) {
                  fprintf(stderr, "expected a diagnostic for the broken sample\n");
                  return 1;
              }
              printf("lr smoke ok: parsed %lld bytes, %llu nodes\n", parsed, galley_node_count(session));
              galley_session_destroy(session);
              return 0;
          }
          EOF
          cc "$work/driver.c" -I"$work/out/include" -L"$work/out/lib" \
            -lkeyvalue-lr -Wl,-rpath,"$work/out/lib" -o "$work/driver"
          "$work/driver"

      - name: Example output is identical across bindings
        run: |
          # Each binding builds through its native flow, mirroring the
          # language-examples job: cmake drives c and cpp, cargo drives
          # rust, go generate + go build drive go.
          for lang in c cpp; do
            cmake -S examples/$lang -B /tmp/build-$lang -DGALLEY_CHECKOUT="$PWD" >/dev/null
            cmake --build /tmp/build-$lang >/dev/null
          done
          GALLEY_CHECKOUT="$PWD" cargo build --release --manifest-path examples/rust/Cargo.toml >/dev/null
          cd examples/go
          GALLEY_CHECKOUT="$PWD/../.." go generate ./...
          go build -o /tmp/example-go .
          cd ../..

          /tmp/build-c/bin/example >/tmp/out-c.txt 2>/tmp/err-c.txt
          /tmp/build-cpp/bin/example >/tmp/out-cpp.txt 2>/tmp/err-cpp.txt
          examples/rust/target/release/galley-rust-example >/tmp/out-rust.txt 2>/tmp/err-rust.txt
          /tmp/example-go >/tmp/out-go.txt 2>/tmp/err-go.txt

          compare() {
            if ! diff -u "$1" "$2"; then
              echo "::error::example output differs ($1 vs $2)"
              echo "===== $1 ====="; cat "$1"
              echo "===== $2 ====="; cat "$2"
              exit 1
            fi
          }
          compare /tmp/out-c.txt /tmp/out-cpp.txt
          compare /tmp/out-c.txt /tmp/out-rust.txt
          compare /tmp/out-c.txt /tmp/out-go.txt
          compare /tmp/err-c.txt /tmp/err-cpp.txt
          compare /tmp/err-c.txt /tmp/err-rust.txt
          compare /tmp/err-c.txt /tmp/err-go.txt
          echo "example output ($(wc -l < /tmp/out-c.txt) stdout lines, $(wc -l < /tmp/err-c.txt) stderr lines) is identical across all bindings"

  test:
    name: test
    if: ${{ always() }}
    needs:
      - core
      - matrix
      - language-examples
      - bindings-consistency
    runs-on: ${{ contains(github.server_url, 'github') && 'ubuntu-latest' || 'codeberg-medium' }}
    steps:
      - name: Verify CI results
        env:
          CORE_RESULT: ${{ needs.core.result }}
          MATRIX_RESULT: ${{ needs.matrix.result }}
          LANGUAGE_EXAMPLES_RESULT: ${{ needs.language-examples.result }}
          BINDINGS_CONSISTENCY_RESULT: ${{ needs.bindings-consistency.result }}
        run: |
          echo "core: $CORE_RESULT"
          echo "matrix: $MATRIX_RESULT"
          echo "language-examples: $LANGUAGE_EXAMPLES_RESULT"
          echo "bindings-consistency: $BINDINGS_CONSISTENCY_RESULT"
          test "$CORE_RESULT" = success
          test "$MATRIX_RESULT" = success
          test "$LANGUAGE_EXAMPLES_RESULT" = success
          test "$BINDINGS_CONSISTENCY_RESULT" = success
