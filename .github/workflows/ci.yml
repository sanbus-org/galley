name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  core:
    name: core
    runs-on: ${{ contains(github.server_url, 'github') && 'ubuntu-latest' || 'codeberg-medium' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Zig
        run: |
          URL=$(curl -s https://ziglang.org/download/index.json | jq -r '."0.16.0"."x86_64-linux".tarball')
          curl -L "$URL" -o zig.tar.xz
          tar -xf zig.tar.xz
          echo "$PWD/zig-x86_64-linux-0.16.0" >>$GITHUB_PATH

      - name: Verify package consumer
        run: zig build -j1 test-package-consumer --summary all

      - name: Run core test suites
        run: |
          zig build -j1 test \
            --summary all \
            --test-timeout 30m \
            -Dtest-filter=suite:build \
            -Dtest-filter=suite:generator \
            -Dtest-filter=suite:runtime \
            -Dtest-filter=suite:galley-parity

  matrix:
    name: matrix (${{ matrix.case }})
    runs-on: ${{ contains(github.server_url, 'github') && 'ubuntu-latest' || 'codeberg-medium' }}
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        case:
          - ll-galley
          - lr-galley
          - ll-json-structured-ast
          - lr-json-structured-ast
          - ll-json
          - lr-json
          - ll-json-augmented
          - ll-json-recovery
          - lr-json-recovery
          - ll-lisp
          - ll-indentation
          - ll-lua
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Fetch large sample fixtures
        run: |
          case="${{ matrix.case }}"
          bash scripts/fetch-large-samples.sh "${case#*-}"

      - name: Install Zig
        run: |
          URL=$(curl -s https://ziglang.org/download/index.json | jq -r '."0.16.0"."x86_64-linux".tarball')
          curl -L "$URL" -o zig.tar.xz
          tar -xf zig.tar.xz
          echo "$PWD/zig-x86_64-linux-0.16.0" >>$GITHUB_PATH

      - name: Run parser test case
        run: |
          zig build -j1 test \
            --summary all \
            --test-timeout 30m \
            -Dtest-filter=case:${{ matrix.case }}

  language-examples:
    name: language-examples (${{ matrix.language }})
    runs-on: ${{ contains(github.server_url, 'github') && 'ubuntu-latest' || 'codeberg-medium' }}
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        language:
          - c
          - cpp
          - rust
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Zig
        run: |
          URL=$(curl -s https://ziglang.org/download/index.json | jq -r '."0.16.0"."x86_64-linux".tarball')
          curl -L "$URL" -o zig.tar.xz
          tar -xf zig.tar.xz
          echo "$PWD/zig-x86_64-linux-0.16.0" >>$GITHUB_PATH

      - name: Build and run example (cmake)
        if: ${{ matrix.language != 'rust' }}
        run: |
          cmake -S examples/${{ matrix.language }} -B build-${{ matrix.language }} \
            -DGALLEY_CHECKOUT="$GITHUB_WORKSPACE"
          cmake --build build-${{ matrix.language }}
          ./build-${{ matrix.language }}/bin/example

      - name: Build and run example (cargo)
        if: ${{ matrix.language == 'rust' }}
        run: |
          GALLEY_CHECKOUT="$GITHUB_WORKSPACE" \
            cargo run --release --manifest-path examples/rust/Cargo.toml

  bindings-consistency:
    name: bindings-consistency
    runs-on: ${{ contains(github.server_url, 'github') && 'ubuntu-latest' || 'codeberg-medium' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Zig
        run: |
          URL=$(curl -s https://ziglang.org/download/index.json | jq -r '."0.16.0"."x86_64-linux".tarball')
          curl -L "$URL" -o zig.tar.xz
          tar -xf zig.tar.xz
          echo "$PWD/zig-x86_64-linux-0.16.0" >>$GITHUB_PATH

      - name: Grammar, options, and error messages are identical across bindings
        run: |
          for file in ll.grm galley.json ll_error_messages.zig; do
            unique=$(sha256sum examples/*/"$file" | awk '{print $1}' | sort -u)
            count=$(printf '%s\n' "$unique" | wc -l)
            echo "$file: $count distinct variants"
            test "$count" = 1 || { echo "::error::$file differs across examples/c, examples/cpp, examples/rust"; exit 1; }
          done

      - name: Generated parser artifacts are identical across bindings
        run: |
          zig build -Doptimize=ReleaseFast install
          for lang in c cpp rust; do
            ./zig-out/bin/galley --emit-metadata "examples/$lang" >/dev/null
          done
          for file in _ll-parser.zig procedures.zig; do
            unique=$(sha256sum examples/*/"$file" | awk '{print $1}' | sort -u)
            count=$(printf '%s\n' "$unique" | wc -l)
            echo "$file: $count distinct variants"
            test "$count" = 1 || { echo "::error::generated $file differs across bindings despite identical grammar and options"; exit 1; }
          done

      - name: Procedure entry points are identical across bindings
        run: |
          names() {
            grep -hoE '\b(hook_|reduction)[A-Za-z0-9_]*[[:space:]]*\(' "$1" | tr -d ' \t(' | sort -u
          }
          names examples/c/procedures.c > /tmp/names-c.txt
          names examples/cpp/procedures.cpp > /tmp/names-cpp.txt
          names examples/rust/procedures.c > /tmp/names-rust.txt
          diff /tmp/names-c.txt /tmp/names-cpp.txt || { echo "::error::C and C++ procedure entry points differ"; exit 1; }
          diff /tmp/names-c.txt /tmp/names-rust.txt || { echo "::error::C and Rust procedure entry points differ"; exit 1; }
          echo "procedure entry points ($(wc -l < /tmp/names-c.txt)) are identical across all bindings"

      - name: Example output is identical across bindings
        run: |
          # Each binding builds through its native flow, mirroring the
          # language-examples job: cmake drives c and cpp, cargo drives rust.
          for lang in c cpp; do
            cmake -S examples/$lang -B /tmp/build-$lang -DGALLEY_CHECKOUT="$PWD" >/dev/null
            cmake --build /tmp/build-$lang >/dev/null
          done
          GALLEY_CHECKOUT="$PWD" cargo build --release --manifest-path examples/rust/Cargo.toml

          /tmp/build-c/bin/example >/tmp/out-c.txt 2>/tmp/err-c.txt
          /tmp/build-cpp/bin/example >/tmp/out-cpp.txt 2>/tmp/err-cpp.txt
          examples/rust/target/release/galley-rust-example >/tmp/out-rust.txt 2>/tmp/err-rust.txt

          compare() {
            if ! diff -u "$1" "$2"; then
              echo "::error::example output differs ($1 vs $2)"
              echo "===== $1 ====="; cat "$1"
              echo "===== $2 ====="; cat "$2"
              exit 1
            fi
          }
          compare /tmp/out-c.txt /tmp/out-cpp.txt
          compare /tmp/out-c.txt /tmp/out-rust.txt
          compare /tmp/err-c.txt /tmp/err-cpp.txt
          compare /tmp/err-c.txt /tmp/err-rust.txt
          echo "example output ($(wc -l < /tmp/out-c.txt) stdout lines, $(wc -l < /tmp/err-c.txt) stderr lines) is identical across all bindings"

  test:
    name: test
    if: ${{ always() }}
    needs:
      - core
      - matrix
      - language-examples
      - bindings-consistency
    runs-on: ${{ contains(github.server_url, 'github') && 'ubuntu-latest' || 'codeberg-medium' }}
    steps:
      - name: Verify CI results
        env:
          CORE_RESULT: ${{ needs.core.result }}
          MATRIX_RESULT: ${{ needs.matrix.result }}
          LANGUAGE_EXAMPLES_RESULT: ${{ needs.language-examples.result }}
          BINDINGS_CONSISTENCY_RESULT: ${{ needs.bindings-consistency.result }}
        run: |
          echo "core: $CORE_RESULT"
          echo "matrix: $MATRIX_RESULT"
          echo "language-examples: $LANGUAGE_EXAMPLES_RESULT"
          echo "bindings-consistency: $BINDINGS_CONSISTENCY_RESULT"
          test "$CORE_RESULT" = success
          test "$MATRIX_RESULT" = success
          test "$LANGUAGE_EXAMPLES_RESULT" = success
          test "$BINDINGS_CONSISTENCY_RESULT" = success
