name: Deploy VitePress site to Pages

on:
  push:
    branches:
      - main
    paths:
      - 'docs/**'
      - 'src/**'
      - 'bindings/js/**'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build Documentation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: docs/package-lock.json

      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Install dependencies
        working-directory: docs
        run: npm ci

      - name: Install JS bindings
        # No lockfile here by convention (every bindings/js/* package
        # gitignores its own; only docs/ tracks one), so this is install,
        # not ci. Mirrors the universal job in ci.yml: the workspace
        # install links core/node/bun/wasm (so bindings/js/wasm/build.mjs
        # resolves its imports by path), then the universal install builds
        # the dist the docs bundle.
        run: |
          npm --prefix bindings/js install --no-audit --no-fund
          npm run build --prefix bindings/js
          npm --prefix bindings/js/universal install --no-audit --no-fund

      - name: Build site
        working-directory: docs
        env:
          GALLEY_CHECKOUT: ${{ github.workspace }}
        run: npm run docs:build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/.vitepress/dist

  deploy:
    name: Deploy to GitHub Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
