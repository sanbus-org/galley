[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "galley"
version = "0.0.0"
description = "Python bindings for Galley-generated parsers"
license = { text = "MIT" }
requires-python = ">=3.8"

[project.scripts]
galley = "galley.build:main"

[tool.setuptools.packages.find]
include = ["galley"]

# Consumers generate and compile with no checkout: the wheel carries the
# compile inputs and the generator CLI for every platform (staged at
# publish; the repo never tracks them).
[tool.setuptools.package-data]
galley = ["py.typed", "compile-kit/**/*", "generator/**/*"]
