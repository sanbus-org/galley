[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "galley-bindings"
version = "0.1.0"
description = "Python bindings for Galley-generated parsers"
license = { text = "MIT" }
requires-python = ">=3.8"

[project.scripts]
galley-bindings = "galley_bindings.build:main"

[tool.setuptools.packages.find]
include = ["galley_bindings*"]
